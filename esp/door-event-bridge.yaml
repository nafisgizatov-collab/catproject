# ESPHome configuration for the ESP-01S relay board photographed with this project.
# It is a bridge: a Yandex scenario changes this switch through Home Assistant;
# the ESP then POSTs the matching door event to TelegramCatDoor on the LAN.
#
# Before compiling, create secrets.yaml next to this file. Do not commit it:
#   wifi_ssid: "your 2.4 GHz Wi-Fi"
#   wifi_password: "your Wi-Fi password"
#   api_encryption_key: "generated by ESPHome"
#   ota_password: "generated by ESPHome"
#   door_api_token: "the same random value as CAT_DOOR_RELAY_TOKEN in .env"
# Replace 192.168.1.XXX with this computer's fixed LAN address.

substitutions:
  name: door-event-bridge
  friendly_name: Door event bridge
  door_api_url: http://192.168.1.XXX:3105/api/door-event

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp8266:
  board: esp01_1m

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Door event bridge setup"

captive_portal:

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

http_request:
  timeout: 5s
  verify_ssl: false

# Most ESP-01S 5 V relay boards use GPIO0 and are active-low. This setting only
# changes the relay coil; it does not switch a mains load. Leave COM/NO/NC empty
# for this project. If the relay status is reversed during the safe bench test,
# change `inverted` to false and flash again.
switch:
  - platform: gpio
    id: door_event
    name: "Door event relay"
    pin:
      number: GPIO0
      inverted: true
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - http_request.post:
          url: ${door_api_url}
          request_headers:
            Content-Type: application/json
            X-Door-Token: !secret door_api_token
          json: |-
            root["state"] = "opened";
    on_turn_off:
      - http_request.post:
          url: ${door_api_url}
          request_headers:
            Content-Type: application/json
            X-Door-Token: !secret door_api_token
          json: |-
            root["state"] = "closed";
