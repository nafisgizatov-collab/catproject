; Telegram Cat Door — единый файл настроек.
; После изменения перезапустите задачу TelegramCatDoor. Значения из .env
; имеют приоритет только как временное аварийное переопределение.
; Секреты TELEGRAM_BOT_TOKEN и YANDEX_OAUTH_TOKEN остаются только в .env.

[outdoor_camera]
; Локальный URL JPEG-кадра уличной камеры через go2rtc.
; Допустим любой URL http:// или https://, который возвращает JPEG.
CAT_SNAPSHOT_URL=http://127.0.0.1:1984/api/frame.jpeg?src=door
; Пауза между лёгкими снимками для анализа движения, миллисекунды.
; Допустимы 500–10000; меньше повышает нагрузку на камеру и компьютер.
CAT_POLL_INTERVAL_MS=1000
; Минимальная пауза между тяжёлыми распознаваниями от движения, миллисекунды.
; Допустимы 1000–60000; больше может пропустить быстрый проход кота.
CAT_MOTION_COOLDOWN_MS=5000
; Пауза повторного подключения к уличной камере при ошибке, миллисекунды.
; Допустимы 1000–300000.
CAT_RECONNECT_INTERVAL_MS=30000
; Средняя разница яркости, считающаяся движением на крыльце.
; Допустимы 1–255; меньше чувствительнее к теням, больше может пропустить кота.
CAT_MOTION_THRESHOLD=7
; Частота контрольного распознавания неподвижного внешнего кадра, миллисекунды.
; Допустимы 5000–300000; больше экономит CPU, но медленнее замечает неподвижного кота.
CAT_PRESENCE_CHECK_INTERVAL_MS=20000
; Частота распознавания внешней камеры после подтверждённого открытия двери, миллисекунды.
; Допустимы 1000–30000; меньше повышает CPU.
CAT_CONTACT_SCAN_INTERVAL_MS=2000
; Левая граница зоны движения на внешнем кадре, доля ширины.
; Допустимы 0.00–1.00; увеличьте, чтобы исключить больше газона слева.
CAT_OUTDOOR_ROI_X=0.28
; Верхняя граница зоны движения на внешнем кадре, доля высоты.
; Допустимы 0.00–1.00.
CAT_OUTDOOR_ROI_Y=0.08
; Ширина зоны движения на внешнем кадре, доля ширины.
; Допустимы 0.01–1.00; зона не должна выходить за правый край кадра.
CAT_OUTDOOR_ROI_WIDTH=0.72
; Высота зоны движения на внешнем кадре, доля высоты.
; Допустимы 0.01–1.00; зона не должна выходить за нижний край кадра.
CAT_OUTDOOR_ROI_HEIGHT=0.83
; Левая граница зоны панели двери для запасного видеодетектора, доля ширины.
; Допустимы 0.00–1.00; используется только при CAT_VIDEO_DOOR_FALLBACK=true.
CAT_DOOR_ROI_X=0.72
; Верхняя граница зоны панели двери, доля высоты.
; Допустимы 0.00–1.00.
CAT_DOOR_ROI_Y=0.10
; Ширина зоны панели двери, доля ширины.
; Допустимы 0.01–1.00.
CAT_DOOR_ROI_WIDTH=0.18
; Высота зоны панели двери, доля высоты.
; Допустимы 0.01–1.00.
CAT_DOOR_ROI_HEIGHT=0.28
; Шаг выборки пикселей для лёгкого анализа движения.
; Допустимы 1–64; больше экономит CPU, но снижает чувствительность.
CAT_MOTION_SAMPLE_STEP=8
; Включает запасное распознавание открытия двери по видео.
; Допустимы true или false. Оставляйте false: основным источником является датчик двери.
CAT_VIDEO_DOOR_FALLBACK=false
; Разница яркости на панели двери для видеосигнала «движение двери».
; Допустимы 1–255; используется только когда CAT_VIDEO_DOOR_FALLBACK=true.
CAT_DOOR_MOTION_THRESHOLD=15
; Более высокий порог видеосигнала «дверь открылась».
; Допустимы 1–255; должен быть не меньше CAT_DOOR_MOTION_THRESHOLD.
CAT_DOOR_OPEN_THRESHOLD=20
; Окно интенсивного анализа после открытия двери, миллисекунды.
; Допустимы 5000–120000.
CAT_DOOR_QUIET_PERIOD_MS=30000
; Максимальное время после открытия, когда внешний кот может считаться вышедшим, миллисекунды.
; Допустимы 30000–900000.
CAT_DOOR_EXIT_WINDOW_MS=300000

[indoor_camera]
; Локальный URL JPEG-кадра внутренней камеры через go2rtc.
; Допустим URL http:// или https://, возвращающий JPEG. Пустое значение включает запасной RTSP-захват через ffmpeg.
CAT_INDOOR_SNAPSHOT_URL=http://127.0.0.1:1984/api/frame.jpeg?src=in
; Путь к ffmpeg.exe для получения кадров RTSP. Пустое значение использует комплектный ffmpeg проекта.
; Допустим полный путь Windows к ffmpeg.exe или пустое значение.
CAT_FFMPEG_PATH=
; RTSP URL внутренней камеры для go2rtc и запасного захвата ffmpeg. Пустое значение отключает запасной канал.
; Допустим rtsp://логин:пароль@адрес:порт/путь; пароль в таком URL не публикуйте.
CAT_INDOOR_RTSP_URL=rtsp://192.168.1.108:8554/in/sd
; Предельное время ожидания одного снимка внутренней камеры, миллисекунды.
; Допустимы 3000–60000.
CAT_INDOOR_CAPTURE_TIMEOUT_MS=25000
; Период лёгкой проверки внутреннего кадра, когда кот дома, миллисекунды.
; Допустимы 3000–60000.
CAT_INDOOR_WATCH_INTERVAL_MS=5000
; Период снимка внутренней камеры, когда кот считается на улице, миллисекунды.
; Допустимы 30000–600000.
CAT_INDOOR_OUTSIDE_CHECK_INTERVAL_MS=60000
; Сколько дверь должна не открываться перед уведомлением «Котик хочет на улицу», миллисекунды.
; Допустимы 60000–86400000.
CAT_INDOOR_DOOR_IDLE_MS=1800000
; Период проверки кресла для уведомления «Котик спит», миллисекунды.
; Допустимы 30000–3600000.
CAT_INDOOR_CHAIR_CHECK_INTERVAL_MS=60000
; Окно подтверждения прихода кота после открытия двери, миллисекунды.
; Допустимы 5000–120000.
CAT_INDOOR_ENTRY_CONFIRMATION_MS=30000
; Средняя разница яркости, считающаяся движением в прихожей.
; Допустимы 1–255; меньше чувствительнее, но чаще включает распознавание.
CAT_INDOOR_ENTRANCE_MOTION_THRESHOLD=10
; Период полного распознавания неподвижного внутреннего кадра, миллисекунды.
; Допустимы 5000–300000; больше экономит CPU, но медленнее замечает неподвижного кота.
CAT_INDOOR_STATIC_CHECK_INTERVAL_MS=20000

[recognition]
; Минимальная уверенность модели для принятия домашнего кота на улице.
; Допустимы 0.00–1.00; больше снижает ложные срабатывания, но повышает пропуски.
CAT_SCORE_MINIMUM=0.65
; Минимальная уверенность для сильного рыжего кандидата.
; Допустимы 0.00–1.00.
CAT_STRONG_ORANGE_SCORE_MINIMUM=0.45
; Минимальная доля рыжего окраса в силуэте для сильного кандидата.
; Допустимы 0.00–1.00.
CAT_STRONG_ORANGE_RATIO_MINIMUM=0.20
; Нижний порог уверенности детектора для сбора кандидатов.
; Допустимы 0.00–1.00; не повышайте без повторной проверки эталонов.
CAT_DETECTION_SCORE_MINIMUM=0.05
; Минимальная доля рыжего цвета по маске кота.
; Допустимы 0.00–1.00; меньше может принять рыжие предметы.
CAT_ORANGE_RATIO_MINIMUM=0.20
; Минимальная уверенность ночного силуэта.
; Допустимы 0.00–1.00; используется только вместе с известным статусом «на улице».
CAT_NIGHT_SCORE_MINIMUM=0.50

[models_and_resources]
; Устройство для быстрого поиска объекта «кот». Допустимы cpu или dml.
; dml использует DirectML и видеокарту NVIDIA/AMD/Intel; на RTX 3050 Ti проверен.
; Видеокарта получает исходные пиксели камеры: внутренний кадр целиком, наружную зону крыльца без масштабирования.
CAT_DETECTOR_DEVICE=dml
; Устройство для сегментации контура и проверки окраса. Допустимо только cpu для текущей модели.
; DirectML у Xenova/detr-resnet-50-panoptic завершается ошибкой Reshape даже на неизменённом и фиксированном кадре.
; Эта модель запускается как резервная проверка: на домашней камере — только для неуверенной находки.
CAT_SEGMENTER_DEVICE=cpu
; Имя модели поиска объектов Hugging Face. Меняйте только на совместимую ONNX-модель.
; Рекомендуемое значение: Xenova/detr-resnet-50.
CAT_DETECTOR_MODEL=Xenova/detr-resnet-50
; Имя модели сегментации. Меняйте только на совместимую ONNX-модель.
; Рекомендуемое значение: Xenova/detr-resnet-50-panoptic.
CAT_SEGMENTER_MODEL=Xenova/detr-resnet-50-panoptic
; Тип весов модели. Допустимо fp32; другие типы требуют совместимых весов.
CAT_MODEL_DTYPE=fp32
; Число потоков ONNX на одно распознавание.
; Допустимы 1–16; 1–2 уменьшают нагрев, 3–4 ускоряют кадр ценой CPU.
CAT_ONNX_INTRA_OP_THREADS=2
; Число потоков между операциями ONNX.
; Допустимы 1–4; обычно оставляйте 1.
CAT_ONNX_INTER_OP_THREADS=1
; Сохранять ли большие промежуточные буферы ONNX между кадрами.
; Допустимы true или false. false уменьшает память, но может немного замедлить кадр.
CAT_ONNX_CPU_MEM_ARENA=false
; Повторно использовать ли шаблоны памяти ONNX.
; Допустимы true или false. false уменьшает удерживаемую память при разных размерах кадров.
CAT_ONNX_MEM_PATTERN=false

[notifications]
; Минимальная пауза между фото-уведомлениями о приходе, миллисекунды.
; Допустимы 0–3600000.
CAT_ALERT_COOLDOWN_MS=300000
; Пауза после сообщения «Котик вышел», миллисекунды.
; Допустимы 0–3600000.
CAT_EXIT_SUPPRESSION_MS=300000
; Сколько ждать подтверждения «Котик дома» после «Котик пришел!», миллисекунды.
; Допустимы 10000–3600000.
CAT_ARRIVAL_PENDING_MS=900000
; ID сценария Яндекс Умного дома, озвучивающего приход котика.
; Допустим UUID существующего сценария или пустое значение для отключения сценария.
YANDEX_CAT_ARRIVED_SCENARIO_ID=1f4dbbf2-7748-4fa8-8387-08faf70c9698
; ID света, который мигает после сообщения о приходе.
; Допустим UUID устройства Яндекса или пустое значение для отключения мигания.
YANDEX_CABINET_LIGHT_ID=89db78e3-c557-4405-b8d5-c81df48e6a61

[door_sensor]
; ID датчика «Входная дверь» в Яндекс Умном доме.
; Допустим UUID устройства. Если пусто, поиск выполняется по имени ниже.
YANDEX_DOOR_DEVICE_ID=53a84ff8-588e-4a73-89ba-a128c67cc695
; Имя датчика для поиска, если ID не задан.
; Допустима любая точная строка названия устройства в Яндекс Умном доме.
YANDEX_DOOR_DEVICE_NAME=Входная дверь
; Интервал опроса состояния датчика, миллисекунды.
; Допустимы 1000–60000; меньше может упереться в лимиты API Яндекса.
YANDEX_DOOR_POLL_INTERVAL_MS=2000

[esp_door_event_bridge]
; Включает локальный HTTP-приёмник событий от ESP-посредника.
; Допустимы true или false. Оставляйте false, пока ESP не прошит и не задан секрет в .env.
CAT_DOOR_RELAY_API_ENABLED=false
; Адрес, на котором принимаются запросы ESP. 0.0.0.0 принимает только в домашней сети и нужен ESP.
; Допустимы 0.0.0.0 или конкретный IPv4-адрес этого компьютера.
CAT_DOOR_RELAY_API_HOST=0.0.0.0
; TCP-порт локального HTTP-приёмника ESP.
; Допустимы 1024–65535. Не используйте порт, занятый другой программой.
CAT_DOOR_RELAY_API_PORT=3105
; Минимальная пауза между одинаковыми запросами ESP, миллисекунды.
; Допустимы 0–60000. Защищает журнал от повторной отправки после нестабильного Wi-Fi.
CAT_DOOR_RELAY_DEBOUNCE_MS=1000
; Секрет запросов ESP хранится только в .env как CAT_DOOR_RELAY_TOKEN, не в этом файле.
; Допустима длинная случайная строка. Без неё HTTP-приёмник намеренно не запускается.
